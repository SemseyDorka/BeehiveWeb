version: '3.8'

services:
  db:
    image: mariadb:10.3
    container_name: beehiveData
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Cucuka123
      MYSQL_DATABASE: beehive_db
    ports:
      - "3306:3306"
    volumes:
      - mariadb_adatok:/var/lib/mysql

  backend:
    build: ./backend
    container_name: beehiveBackend
    restart: always
    ports:
      - "8080:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: beehiveFrontend
    restart: always
    ports:
      - "5000:5173"
    depends_on:
      - backend

volumes:
  mariadb_adatok: