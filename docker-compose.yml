version: '3.8'

services:
  proxy:
    image: nginx:alpine
    container_name: beehiveProxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - beehive_web
  db:
    image: mariadb:10.3
    container_name: beehiveData
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - beehive_db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - beehive_web

  backend:
    build: ./backend
    container_name: beehiveBackend
    restart: always
    depends_on:
      - db
    environment:
      - DB_PASSWORD=${DB_PASSWORD}  
      - DB_NAME=${DB_NAME}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MONGO_URI=${MONGO_URI}
    networks:
      - beehive_web

  frontend:
    build: ./frontend
    container_name: beehiveFrontend
    restart: always
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - beehive_web      

networks:
  beehive_web:
    driver: bridge

volumes:
  beehive_db_data: