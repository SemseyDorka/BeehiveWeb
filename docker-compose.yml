version: '3.8'

services:

  db:
    image: mariadb:10.3
    container_name: beehiveData
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - beehive_db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - beehive_web

  backend:
    build: ./backend
    container_name: beehiveBackend
    restart: always
    depends_on:
      - db
    environment:
      - DB_PASSWORD=${DB_PASSWORD}  
      - DB_NAME=${DB_NAME}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MONGO_URI=${MONGO_URI}
    ports:
      - "127.0.0.1:6789:8000"
    networks:
      - beehive_web

  frontend:
    build: ./frontend
    container_name: beehiveFrontend
    restart: always
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:9876:80"
    networks:
      - beehive_web      

networks:
  beehive_web:
    driver: bridge

volumes:
  beehive_db_data: